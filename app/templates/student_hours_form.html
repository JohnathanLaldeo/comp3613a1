{% extends "authenticated-base.html" %}
{% block title %}Log Volunteer Hours{% endblock %}

{% block subpage_content %}
<div class="student-shell">
  <h1 class="page-title mb-4">Log Volunteer Hours</h1>
  <form class="volunteer-form" method="post" action="{{ url_for('user_hours_create') }}">
    <div class="volunteer-form-fields">
      <div class="mb-3">
        <label class="form-label fw-bold" for="event_date">Date</label>
        <input class="form-control" type="date" id="event_date" name="event_date" required>
      </div>
      <div class="mb-3">
        <label class="form-label fw-bold" for="activity">Activity</label>
        <input class="form-control" type="text" id="activity" name="activity" placeholder="e.g. Beach cleanup" required>
      </div>
      <div class="mb-3 volunteer-hours-field">
        <label class="form-label fw-bold" for="hours">Hours</label>
        <input class="form-control" type="number" id="hours" name="hours" min="1" max="50" step="1" value="1" required>
      </div>
    </div>

    <aside class="volunteer-review-note">
      Hours are reviewed by an admin before they count.
    </aside>

    <div class="mb-3 volunteer-notes-field">
      <label class="form-label fw-bold" for="notes">Notes / proof (optional)</label>
      <textarea class="form-control" id="notes" name="notes" rows="3" placeholder="Add details about your volunteer activity"></textarea>
    </div>

    <div class="d-flex flex-wrap gap-3">
      <button type="submit" class="btn btn-brand">Submit for Review</button>
      <a class="btn btn-outline-brand volunteer-cancel" href="{{ url_for('user_home_view') }}">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
